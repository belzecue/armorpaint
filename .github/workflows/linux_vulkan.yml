name: Linux (Vulkan)

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Apt Update
      run: sudo apt-get update
    - name: Apt Install
      run: sudo apt install make clang libvulkan-dev libgtk-3-dev libasound2-dev --yes --quiet
    - name: Compile
      run: |
        cd paint
        ../base/make --compile
    - name: Collect build outputs for artifact
      id: collect
      run: |
        set -euo pipefail
        cd $GITHUB_WORKSPACE

        # create artifact staging dir
        rm -rf artifact
        mkdir -p artifact

        # search for likely outputs under paint and copy them into artifact preserving paths
        # adjust the find patterns to match your actual binary names/locations
        find paint -type f \
          \( -perm /111 -o -name 'ArmorPaint' -o -name 'paint' -o -iname 'paint*' -o -iname '*.png' -o -iname '*.so' -o -iname '*.dll' \) \
          -not -path '*/.git/*' -print0 \
          | xargs -0 -I{} bash -c 'mkdir -p artifact/$(dirname "{}"); cp -v "{}" "artifact/{}"'

        # show what we staged
        echo "Staged files:"
        ls -laR artifact || true

        # fail early if nothing was staged
        if [ -z "$(find artifact -type f -print -quit || true)" ]; then
          echo "No files were staged into artifact/ — check the find patterns and build output paths" >&2
          exit 1
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: paint-linux-binary
        path: artifact
        if-no-files-found: error

